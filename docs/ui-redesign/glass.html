<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDCCI 控制台 · 玻璃拟态</title>
<style>
  :root{
    --glass:rgba(255,255,255,.10); --glass2:rgba(255,255,255,.16); --stroke:rgba(255,255,255,.22);
    --ink:#f4f7ff; --sub:rgba(226,232,255,.72); --faint:rgba(206,214,245,.5);
    --g1:#5eead4; --g2:#818cf8; --g3:#f472b6;
    --sans:'Segoe UI',system-ui,-apple-system,sans-serif; --mono:'Consolas','SF Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:grid;place-items:center;font-family:var(--sans);color:var(--ink);padding:24px;
       background:#0b1020;-webkit-font-smoothing:antialiased;overflow:hidden}
  /* 彩色光斑背景 */
  body::before{content:"";position:fixed;inset:-20%;z-index:0;filter:blur(80px);opacity:.85;
     background:
       radial-gradient(40% 40% at 20% 25%,#5eead4aa,transparent 60%),
       radial-gradient(45% 45% at 80% 20%,#818cf8aa,transparent 60%),
       radial-gradient(50% 50% at 70% 85%,#f472b6aa,transparent 60%),
       radial-gradient(40% 40% at 25% 80%,#38bdf8aa,transparent 60%);
     animation:drift 18s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translate(3%,-3%) scale(1.08)}}
  .stage{width:480px;max-width:100%;position:relative;z-index:1}
  .win{height:868px;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;
     background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
     backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
     border:1px solid var(--stroke);box-shadow:0 30px 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28)}

  .bar{display:flex;align-items:center;gap:11px;padding:20px 22px 0}
  .brand{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--g2));
     display:grid;place-items:center;color:#0b1020;font-weight:800;font-family:var(--mono);font-size:14px;
     box-shadow:0 4px 14px rgba(129,140,248,.5)}
  .ttl{font-size:15px;font-weight:700}
  .ttl small{display:block;font-size:9.5px;font-weight:500;color:var(--faint);letter-spacing:.16em;margin-top:1px}
  .wbtns{margin-left:auto;display:flex;gap:5px}
  .wb{width:30px;height:30px;border:1px solid var(--stroke);background:var(--glass);border-radius:10px;color:var(--sub);
     cursor:pointer;font-size:14px;display:grid;place-items:center;transition:.15s;backdrop-filter:blur(6px)}
  .wb:hover{background:var(--glass2);color:#fff}
  .wb.x:hover{background:rgba(244,114,182,.45);border-color:transparent;color:#fff}

  .scroll{flex:1;overflow-y:auto;padding:20px 22px 20px;display:flex;flex-direction:column;gap:16px}
  .scroll::-webkit-scrollbar{width:7px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}

  .card{background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:14px 16px;
     box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .select{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .select .nm{font-size:14px;font-weight:600}
  .select .id{font-family:var(--mono);font-size:11px;color:var(--faint)}

  .strip{display:flex;align-items:center;gap:12px}
  .addr{display:flex;gap:3px;background:var(--glass);border:1px solid var(--stroke);border-radius:12px;padding:3px}
  .addr button{border:0;background:transparent;color:var(--sub);font-family:var(--mono);font-size:12px;font-weight:600;
     padding:7px 15px;border-radius:9px;cursor:pointer;transition:.18s}
  .addr button.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#0b1020;box-shadow:0 3px 12px rgba(94,234,212,.5)}
  .vers{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--sub)}
  .vers b{color:#fff}

  .sec{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;padding-left:2px}

  .crow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .crow .nm{font-size:14px;font-weight:600}
  .crow .vv{font-family:var(--mono);font-size:24px;font-weight:700}
  .crow .vv small{font-size:12px;color:var(--faint);font-weight:400}
  .slider{position:relative;height:10px;background:rgba(255,255,255,.14);border-radius:6px;cursor:pointer;
     box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
  .slider .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;
     background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 0 16px rgba(129,140,248,.6)}
  .slider .k{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);
     background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 0 4px rgba(255,255,255,.25)}

  .seg{display:flex;flex-wrap:wrap;gap:7px}
  .seg button{flex:1;min-width:56px;border:1px solid var(--stroke);background:var(--glass);color:var(--sub);
     font-family:var(--mono);font-size:12px;font-weight:600;padding:10px 5px;border-radius:12px;cursor:pointer;transition:.18s}
  .seg button:hover{background:var(--glass2)}
  .seg button.on{background:linear-gradient(135deg,var(--g2),var(--g3));color:#fff;border-color:transparent;
     box-shadow:0 4px 16px rgba(244,114,182,.45)}

  .dpad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .key{background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:15px 4px;text-align:center;cursor:pointer;
     transition:.14s;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
  .key:hover{background:var(--glass2)}
  .key:active,.key.hit{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;transform:scale(.94)}
  .key.hit .kl,.key.hit .ks{color:#0b1020}
  .key .kl{display:block;font-size:16px;font-weight:600}
  .key .ks{display:block;font-size:9px;color:var(--faint);margin-top:5px;letter-spacing:.1em;font-weight:600}

  details.log summary{list-style:none;cursor:pointer;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.05em;padding:2px}
  details.log summary::after{content:" ›"}
  details.log[open] summary::after{content:" ⌄"}
  .logbody{margin-top:11px;display:flex;flex-direction:column;gap:6px;max-height:130px;overflow-y:auto}
  .lrow{display:flex;gap:10px;font-size:11px;font-family:var(--mono);line-height:1.4}
  .lrow .t{color:var(--faint)}
  .lrow .ok{color:var(--g1);font-weight:600}
  .lrow .fr{color:var(--sub)}
</style>
</head>
<body>
<div class="stage">
  <div class="win">
    <div class="bar">
      <span class="brand">D</span>
      <span class="ttl">DDCCI 控制台<small>MONITOR CONTROL</small></span>
      <span class="wbtns">
        <button class="wb" title="刷新">⟳</button>
        <button class="wb" title="换肤">◑</button>
        <button class="wb" title="最小化">–</button>
        <button class="wb x" title="关闭">✕</button>
      </span>
    </div>
    <div class="scroll">
      <div class="card select"><span class="nm">RTD2785 · 2560×1440</span><span class="id">[0] ▾</span></div>

      <div class="strip">
        <div class="addr" data-toggle>
          <button data-a="5E">0x5E</button>
          <button data-a="6E" class="on">0x6E</button>
        </div>
        <div class="vers">硬件 <b>v101</b> · 软件 <b>v101</b></div>
      </div>

      <div class="sec">图像 Image</div>

      <div class="card" data-slider data-max="100" data-val="50">
        <div class="crow"><span class="nm">亮度</span><span class="vv"><span class="num">50</span><small> /100</small></span></div>
        <div class="slider"><div class="f" style="width:50%"></div><div class="k" style="left:50%"></div></div>
      </div>
      <div class="card" data-slider data-max="100" data-val="51">
        <div class="crow"><span class="nm">对比度</span><span class="vv"><span class="num">51</span><small> /100</small></span></div>
        <div class="slider"><div class="f" style="width:51%"></div><div class="k" style="left:51%"></div></div>
      </div>

      <div class="card">
        <div class="crow"><span class="nm">色温</span></div>
        <div class="seg" data-seg><button>6500K</button><button class="on">9300K</button><button>User</button></div>
      </div>
      <div class="card">
        <div class="crow"><span class="nm">Gamma</span></div>
        <div class="seg" data-seg><button>γ1</button><button>γ2</button><button>γ3</button><button class="on">γ4</button><button>γ5</button><button>γ6</button><button>γ7</button></div>
      </div>

      <div class="sec">模拟按键 OSD</div>
      <div class="dpad" data-dpad>
        <div class="key"><span class="kl">▤</span><span class="ks">MENU</span></div>
        <div class="key"><span class="kl">◀</span><span class="ks">LEFT</span></div>
        <div class="key"><span class="kl">▶</span><span class="ks">RIGHT</span></div>
        <div class="key"><span class="kl">✕</span><span class="ks">EXIT</span></div>
      </div>

      <details class="card log" open>
        <summary>命令日志 · 原始帧</summary>
        <div class="logbody">
          <div class="lrow"><span class="t">21:34:07</span><span class="ok">写亮度=50</span><span class="fr">6E 51 84 03 10 00 32 9A</span></div>
          <div class="lrow"><span class="t">21:34:07</span><span class="ok">读亮度 →50/100</span><span class="fr">6E 51 82 01 10 AC</span></div>
          <div class="lrow"><span class="t">21:33:55</span><span class="ok">按键 MENU</span><span class="fr">6E 51 84 C0 96 00 …</span></div>
        </div>
      </details>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('[data-slider]').forEach(g=>{
    const track=g.querySelector('.slider'),f=g.querySelector('.f'),k=g.querySelector('.k'),num=g.querySelector('.num'),max=+g.dataset.max;
    let drag=false;const set=e=>{const r=track.getBoundingClientRect();let v=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*max);
      const p=v/max*100;f.style.width=p+'%';k.style.left=p+'%';num.textContent=v;};
    track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);set(e);});
    track.addEventListener('pointermove',e=>{if(drag)set(e);});
    track.addEventListener('pointerup',()=>drag=false);
  });
  document.querySelectorAll('[data-seg],[data-toggle]').forEach(s=>s.addEventListener('click',e=>{
    if(e.target.tagName!=='BUTTON')return;s.querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');
  }));
  document.querySelectorAll('[data-dpad] .key').forEach(k=>k.addEventListener('click',()=>{k.classList.add('hit');setTimeout(()=>k.classList.remove('hit'),200);}));
</script>
</body>
</html>
